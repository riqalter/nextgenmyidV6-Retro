<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
	<!-- 1-bit monogram: one red block, one ink block. no grey, no rounding. -->
	<rect width="32" height="32" fill="#f5f2ea"/>
	<g fill="#1c1a17">
		<rect x="4" y="6" width="3" height="20"/>
		<rect x="4" y="6" width="11" height="3"/>
		<rect x="4" y="23" width="11" height="3"/>
		<rect x="17" y="6" width="3" height="20"/>
		<rect x="20" y="6" width="3" height="3"/>
		<rect x="20" y="14" width="8" height="3"/>
		<rect x="20" y="23" width="8" height="3"/>
		<rect x="25" y="6" width="3" height="8"/>
	</g>
	<rect x="17" y="9" width="3" height="3" fill="#c8102e"/>
</svg>