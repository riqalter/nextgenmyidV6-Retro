<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
	<title>Mikail Thoriq — MT</title>
	<!-- MT on a 2px grid, so the letters stay crisp at 16px. -->
	<rect width="32" height="32" fill="#f5f2ea"/>
	<g fill="#1c1a17">
		<!-- M -->
		<rect x="4" y="8" width="2" height="16"/>
		<rect x="12" y="8" width="2" height="16"/>
		<rect x="6" y="10" width="2" height="2"/>
		<rect x="8" y="12" width="2" height="2"/>
		<rect x="10" y="10" width="2" height="2"/>
		<!-- T -->
		<rect x="18" y="8" width="10" height="2"/>
		<rect x="22" y="10" width="2" height="12"/>
	</g>
	<rect x="22" y="22" width="2" height="2" fill="#c8102e"/>
</svg>
