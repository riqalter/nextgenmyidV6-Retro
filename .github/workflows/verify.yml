name: Verify
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # A fresh, offline checkout must still publish the handwritten work.
      - run: npm run build
        env:
          GITHUB_OFFLINE: '1'
      - run: test -f build/sitemap.xml && test -f build/robots.txt && test -f build/work/decklify/index.html
